# Cloudflare Pages Configuration for ECHOX STORE (100% Free Plan)
name = "echoxstore"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
VITE_SITE_URL = "https://echoxstore.pages.dev"
